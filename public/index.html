<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>✊ Jokenpo Multiplayer</title>
    <link rel="stylesheet" href="/css/style.css" />
  </head>
  <body>
    <div id="screen-join" class="screen active">
      <div class="join-box">
        <div class="logo">
          <span class="logo-icons">✊ ✋ ✌️</span>
          <h1>Jokenpo<span>.io</span></h1> <p class="subtitle">Multiplayer em tempo real</p>
        </div>
        <div class="form-group">
          <label for="playerName">Seu nome</label>
          <input type="text" id="playerName" placeholder="Ex: João" maxlength="16" autocomplete="off" />
        </div>
        <div class="form-group">
          <label for="roomId">Código da sala</label>
          <input type="text" id="roomId" placeholder="Ex: sala123" maxlength="16" autocomplete="off" />
        </div>
        <button id="btn-join" class="btn btn-primary">Entrar na Sala</button>
        <p id="join-error" class="error-msg"></p>
      </div>
    </div>

    <div id="screen-waiting" class="screen">
      <div class="waiting-box">
        <div class="spinner"></div>
        <h2>Aguardando oponente...</h2>
        <p id="waiting-room-info"></p>
        <p class="tip">Compartilhe o código da sala com seu amigo!</p>
        <div id="room-code-display" class="room-code"></div>
      </div>
    </div>

    <div id="screen-game" class="screen">
      <div class="game-header">
        <div class="score-card" id="score-j1">
          <span class="score-name" id="name-j1">Jogador 1</span>
          <span class="score-value" id="pts-j1">0</span>
        </div>
        <div class="round-info">
          <span id="round-label">Rodada</span>
          <span id="round-number">1 / 3</span>
        </div>
        <div class="score-card" id="score-j2">
          <span class="score-name" id="name-j2">Jogador 2</span>
          <span class="score-value" id="pts-j2">0</span>
        </div>
      </div>

      <div class="status-bar">
        <p id="game-status">Faça sua escolha!</p>
      </div>

      <div class="choices-display" id="choices-display" style="display:none">
        <div class="choice-reveal" id="reveal-j1">
          <div class="choice-icon" id="icon-j1">?</div>
          <div class="choice-label" id="label-j1"></div>
        </div>
        <div class="vs-badge">VS</div>
        <div class="choice-reveal" id="reveal-j2">
          <div class="choice-icon" id="icon-j2">?</div>
          <div class="choice-label" id="label-j2"></div>
        </div>
      </div>

      <div class="choices-grid" id="choices-grid">
        <button class="choice-btn" data-choice="pedra">
          <span class="choice-emoji">✊</span>
          <span>Pedra</span>
        </button>
        <button class="choice-btn" data-choice="papel">
          <span class="choice-emoji">✋</span>
          <span>Papel</span>
        </button>
        <button class="choice-btn" data-choice="tesoura">
          <span class="choice-emoji">✌️</span>
          <span>Tesoura</span>
        </button>
      </div>

      <div class="chosen-indicators">
        <div id="indicator-j1" class="chosen-dot"></div>
        <span id="indicator-text">Aguardando escolhas...</span>
        <div id="indicator-j2" class="chosen-dot"></div>
      </div>
    </div>

    <div id="screen-gameover" class="screen">
      <div class="gameover-box">
        <div id="gameover-icon" class="gameover-icon">🏆</div>
        <h2 id="gameover-title">Fim de Jogo!</h2>
        <p id="gameover-msg"></p>
        <div class="final-scores" id="final-scores"></div>
        <button id="btn-restart" class="btn btn-primary">Jogar Novamente</button>
        <button id="btn-back" class="btn btn-secondary">Sair</button>
      </div>
    </div>

    <script src="/socket.io/socket.io.js"></script>
    <script src="/js/jogo.js"></script>
  </body>
</html>
